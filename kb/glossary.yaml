# keyword -> meaning / default_api / related_docs
chanvese:
  meaning: "Chan–Vese active contour (region-based segmentation) refine method"
  default_api: "vibe_research.recipes.chanvese_refine"
  related_docs:
    - "docs/recipes/chanvese.md"

gac:
  meaning: "Geodesic Active Contour (edge-based) refine method"
  default_api: "vibe_research.recipes.gac_refine"
  related_docs:
    - "docs/recipes/gac.md"

depgraph:
  meaning: "Dependency graph based structured pruning (Torch-Pruning style DepGraph)."
  default_api: "vibe_research.pruning.build_depgraph_pruner"
  related_docs:
    - "docs/recipes/torch_pruning_depgraph.md"

ultralytics_yolov8:
  meaning: "Ultralytics YOLOv8 model built from YAML via ultralytics.YOLO"
  default_api: "vibe_research.integrations.ultralytics.build_yolov8_from_yaml"
  related_docs:
    - "docs/recipes/yolov8_prune_backbone.md"
